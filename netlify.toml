[build]
  # Directorio de publicación (donde está index.html)
  publish = "."
  
  # Sin comando de build - sitio estático HTML puro
  # No necesita npm install ni build process

# Configuración de redirecciones
# productos.html eliminado: redirigir a galería
[[redirects]]
  from = "/productos.html"
  to = "/productos-galeria.html"
  status = 301

[[redirects]]
  from = "/productos-simple.html"
  to = "/productos-simple.html"
  status = 200

[[redirects]]
  from = "/productos-galeria.html"
  to = "/productos-galeria.html"
  status = 200

[[redirects]]
  from = "/admin-fotos.html"
  to = "/admin-fotos.html"
  status = 200

# Redirigir todo lo demás a index.html para SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers para archivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para imágenes
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para JSON
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

