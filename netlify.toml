[build]
  # Directorio de publicación (donde está index.html)
  publish = "."
  
  # Sin comando de build - sitio estático HTML puro
  # No necesita npm install ni build process

# Configuración de redirecciones
# productos.html eliminado: redirigir a galería
[[redirects]]
  from = "/productos.html"
  to = "/productos-galeria.html"
  status = 301

[[redirects]]
  from = "/productos-simple.html"
  to = "/productos-simple.html"
  status = 200

[[redirects]]
  from = "/productos-galeria.html"
  to = "/productos-galeria.html"
  status = 200

[[redirects]]
  from = "/admin-fotos.html"
  to = "/admin-fotos.html"
  status = 200

# Páginas legales (estáticas)
[[redirects]]
  from = "/tietosuoja.html"
  to = "/tietosuoja.html"
  status = 200
[[redirects]]
  from = "/ehdot.html"
  to = "/ehdot.html"
  status = 200
[[redirects]]
  from = "/evastekaytanto.html"
  to = "/evastekaytanto.html"
  status = 200

# IMPORTANTE: /photos/* y /assets/* deben servirse como archivos, no redirigir a index
[[redirects]]
  from = "/photos/*"
  to = "/photos/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# Redirigir el resto a index.html para SPA (solo rutas que no son archivos estáticos)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad (cybersecurity)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Headers para archivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para imágenes
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para JSON
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

